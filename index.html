<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Журнал тренера — Гребля на каноэ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем клиент Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-hover: #20242e;
      --text: #f0f2f5;
      --hint: #8b949e;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --border: rgba(255, 255, 255, 0.08);
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 80px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Шапка */
    .header {
      background: var(--card);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .app-title {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }
    .sync-status {
      font-size: 11px;
      font-weight: 400;
      color: var(--hint);
      margin-top: 2px;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select.year-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 600;
      font-size: 14px;
      outline: none;
    }

    /* Вкладки групп */
    .groups-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .groups-scroll::-webkit-scrollbar { display: none; }
    .group-chip {
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: 0.15s;
    }
    .group-chip.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .group-badge {
      font-size: 11px;
      opacity: 0.75;
      font-weight: 400;
      margin-left: 4px;
    }

    /* Панель даты */
    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--card);
      margin: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .date-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .current-date { text-align: center; }
    .current-date strong { display: block; font-size: 15px; }
    .current-date span { font-size: 12px; color: var(--hint); }

    .add-session-btn {
      background: rgba(59, 130, 246, 0.16);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Панель быстрых действий */
    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px 8px;
      font-size: 13px;
      color: var(--hint);
    }
    .mark-all-btn {
      background: none;
      border: none;
      color: #60a5fa;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 0;
    }

    /* Список учеников */
    .student-list {
      margin: 0 12px;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .student-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .student-row:last-child { border-bottom: none; }
    .student-row:active { background: var(--card-hover); }
    .student-info { display: flex; flex-direction: column; }
    .student-name { font-size: 15px; font-weight: 500; }
    .student-meta { font-size: 12px; color: var(--hint); margin-top: 2px; }

    /* Чекбокс статуса */
    .status-box {
      min-width: 96px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: 0.15s;
    }
    .status-none { color: var(--hint); background: var(--bg); }
    .status-present { background: rgba(34, 197, 94, 0.15); color: var(--green); border-color: rgba(34, 197, 94, 0.4); }
    .status-absent { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: rgba(239, 68, 68, 0.4); }
    .status-sick { background: rgba(245, 158, 11, 0.15); color: var(--orange); border-color: rgba(245, 158, 11, 0.4); }

    /* Табель */
    .table-wrap {
      margin: 12px;
      background: var(--card);
      border-radius: 12px;
      overflow-x: auto;
      padding: 12px;
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: var(--card);
      font-weight: 500;
      min-width: 130px;
    }

    /* Управление */
    .card-box {
      margin: 12px;
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
    }
    .card-box h3 { margin: 0 0 12px 0; font-size: 16px; }
    .row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .input-field {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .btn-primary {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .manage-item:last-child { border-bottom: none; }
    .del-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Нижнее меню */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--hint);
      background: none;
      border: none;
      cursor: pointer;
      gap: 3px;
    }
    .nav-item.active { color: #60a5fa; font-weight: 600; }
    .nav-icon { font-size: 20px; }
    .empty-state { padding: 24px; text-align: center; color: var(--hint); font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <div class="header">
    <div class="header-top">
      <div class="app-title">
        <span>🛶 Каноэ • Журнал</span>
        <span id="syncStatus" class="sync-status">⏳ Загрузка из облака...</span>
      </div>
      <div class="header-controls">
        <button class="icon-btn" title="Обновить из облака" onclick="loadFromCloud()">🔄</button>
        <select id="yearSelect" class="year-select" onchange="changeYear(this.value)"></select>
      </div>
    </div>
    <div id="groupsContainer" class="groups-scroll"></div>
  </div>

  <!-- ВКЛАДКА 1: ЕЖЕДНЕВНЫЙ ЖУРНАЛ -->
  <div id="tab-journal">
    <div class="date-bar">
      <div class="date-nav">
        <button class="icon-btn" onclick="shiftSession(-1)">‹</button>
        <div class="current-date">
          <strong id="sessionDateTitle">—</strong>
          <span id="sessionTypeLabel">—</span>
        </div>
        <button class="icon-btn" onclick="shiftSession(1)">›</button>
      </div>
      <button class="add-session-btn" onclick="addExtraSession()">+ Тренировка</button>
    </div>

    <div class="actions-row">
      <span id="statsCounter">На тренировке: 0 из 0</span>
      <button class="mark-all-btn" onclick="markAllPresent()">✓ Отметить всех</button>
    </div>

    <div id="studentList" class="student-list"></div>
  </div>

  <!-- ВКЛАДКА 2: ТАБЕЛЬ ЗА МЕСЯЦ -->
  <div id="tab-report" class="hidden">
    <div class="table-wrap">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong id="reportGroupTitle">Табель группы</strong>
        <button class="add-session-btn" onclick="exportCSV()">📥 Excel (CSV)</button>
      </div>
      <table id="reportTable"></table>
    </div>
  </div>

  <!-- ВКЛАДКА 3: УПРАВЛЕНИЕ ГРУППАМИ, УЧЕНИКАМИ И ГОДОМ -->
  <div id="tab-settings" class="hidden">
    <div class="card-box">
      <h3 id="manageStudentsTitle">Спортсмены группы</h3>
      <div class="row-2col">
        <input type="text" id="newStudentName" class="input-field" placeholder="Фамилия Имя" />
        <input type="number" id="newStudentYear" class="input-field" placeholder="Год рожд. (2014)" />
      </div>
      <button class="btn-primary" onclick="addStudent()">+ Добавить спортсмена</button>
      <div id="manageStudentsList" style="margin-top: 12px;"></div>
    </div>

    <div class="card-box">
      <h3>Группы учебного года (<span id="manageYearLabel"></span>)</h3>
      <input type="text" id="newGroupName" class="input-field" placeholder="Название (напр. НП-2 или УТГ-3)" />
      <div class="row-2col">
        <select id="newGroupFreq" class="input-field">
          <option value="3 тр/нед">3 тренировки/нед (НП)</option>
          <option value="4 тр/нед">4 тренировки/нед (УТГ)</option>
          <option value="5 тр/нед">5 тренировок/нед (УТГ)</option>
          <option value="6 тр/нед">6 тренировок/нед (УТГ)</option>
        </select>
        <input type="text" id="newGroupDays" class="input-field" placeholder="Дни (Пн, Ср, Пт)" />
      </div>
      <button class="btn-primary" onclick="addGroup()">+ Создать группу</button>
      <div id="manageGroupsList" style="margin-top: 12px;"></div>
    </div>

    <div class="card-box">
      <h3>Новый учебный год</h3>
      <p style="font-size:13px; color:var(--hint); margin-top:0;">
        Создаст следующий учебный год, переведет группы на ступень выше (НП-1 → НП-2) и скопирует списки спортсменов.
      </p>
      <button class="btn-primary" onclick="createNextAcademicYear()">📅 Начать новый учебный год</button>
    </div>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('journal', this)">
      <span class="nav-icon">📋</span>
      <span>Журнал</span>
    </button>
    <button class="nav-item" onclick="switchTab('report', this)">
      <span class="nav-icon">📊</span>
      <span>Табель</span>
    </button>
    <button class="nav-item" onclick="switchTab('settings', this)">
      <span class="nav-icon">⚙️</span>
      <span>Управление</span>
    </button>
  </div>

<script>
  // ==========================================
  // НАСТРОЙКИ SUPABASE (ВСТАВЬТЕ СВОИ ДАННЫЕ)
  // ==========================================
  const SUPABASE_URL = "https://egpminbmdimdrnofsiqh.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVncG1pbmJtZGltZHJub2ZzaXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NDM1OTYsImV4cCI6MjExMTExOTU5Nn0.iicrPN8eU8A2CJNo-I6QYecMED1h8Kx83LI4hf1Z5mI";
  const RECORD_ID = "main_coach_journal"; // Идентификатор записи в базе

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#181b22");
    tg.setBackgroundColor("#0f1115");
  }

  const defaultData = {
    activeYear: "2026–2027",
    years: {
      "2026–2027": {
        groups: [
          {
            id: "np1",
            name: "НП-1",
            scheduleText: "3 тр/нед (Пн, Ср, Пт)",
            students: [
              { id: "s1", name: "Волков Артем", birth: 2015 },
              { id: "s2", name: "Громова Алиса", birth: 2015 },
              { id: "s3", name: "Зайцев Максим", birth: 2014 },
              { id: "s4", name: "Киселев Даниил", birth: 2015 }
            ],
            sessions: [
              { id: "ses1", date: "23 ноя (Пн)", type: "Бассейн / ОФП", marks: { s1: "present", s2: "present", s3: "absent", s4: "present" } },
              { id: "ses2", date: "25 ноя (Ср)", type: "Зал ОФП", marks: { s1: "present", s2: "sick", s3: "present", s4: "present" } }
            ]
          },
          {
            id: "utg2",
            name: "УТГ-2",
            scheduleText: "5 тр/нед (Пн–Пт)",
            students: [
              { id: "u1", name: "Белов Кирилл", birth: 2011 },
              { id: "u2", name: "Дроздов Егор", birth: 2010 },
              { id: "u3", name: "Лебедева Дарья", birth: 2011 }
            ],
            sessions: [
              { id: "uses1", date: "24 ноя (Вт)", type: "Вода • 8 км", marks: { u1: "present", u2: "present", u3: "present" } }
            ]
          }
        ]
      }
    }
  };

  let state = JSON.parse(localStorage.getItem("canoe_app_cache")) || defaultData;
  let currentGroupIndex = 0;
  let currentSessionIndex = 0;
  let saveTimeout = null;

  function setSyncStatus(text, color = "var(--hint)") {
    const el = document.getElementById("syncStatus");
    el.innerText = text;
    el.style.color = color;
  }

  // Загрузка данных из Supabase при старте
  async function loadFromCloud() {
    if (SUPABASE_URL.includes("ВАШ_ПРОЕКТ")) {
      setSyncStatus("⚠️ Вставьте ключи Supabase в код", "var(--orange)");
      return;
    }

    setSyncStatus("⏳ Загрузка из облака...");
    try {
      const { data, error } = await db
        .from("app_state")
        .select("data")
        .eq("id", RECORD_ID)
        .maybeSingle();

      if (error) throw error;

      if (data && data.data) {
        state = data.data;
        localStorage.setItem("canoe_app_cache", JSON.stringify(state));
        const g = getCurrentGroup();
        currentSessionIndex = g ? Math.max(0, g.sessions.length - 1) : 0;
        renderAll();
        if (!document.getElementById("tab-settings").classList.contains("hidden")) renderSettings();
        if (!document.getElementById("tab-report").classList.contains("hidden")) renderReport();
        setSyncStatus("☁️ Синхронизировано", "var(--green)");
      } else {
        // Первый запуск: записываем начальные данные в облако
        await saveToCloudNow();
      }
    } catch (err) {
      console.error("Ошибка загрузки:", err);
      setSyncStatus("⚠️ Офлайн (локальная копия)", "var(--orange)");
    }
  }

  // Сохранение с небольшой задержкой (debounce), чтобы не спамить запросами при быстрых кликах
  function saveState() {
    localStorage.setItem("canoe_app_cache", JSON.stringify(state));
    setSyncStatus("⏳ Сохранение...", "#60a5fa");

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveToCloudNow, 500);
  }

  async function saveToCloudNow() {
    if (SUPABASE_URL.includes("ВАШ_ПРОЕКТ")) return;
    try {
      const { error } = await db
        .from("app_state")
        .upsert({
          id: RECORD_ID,
          data: state,
          updated_at: new Date().toISOString()
        });

      if (error) throw error;
      setSyncStatus("☁️ Сохранено в облаке", "var(--green)");
    } catch (err) {
      console.error("Ошибка сохранения:", err);
      setSyncStatus("⚠️ Ошибка сети (сохранено локально)", "var(--red)");
    }
  }

  function getGroups() {
    return state.years[state.activeYear].groups;
  }

  function getCurrentGroup() {
    const groups = getGroups();
    if (!groups.length) return null;
    if (currentGroupIndex >= groups.length) currentGroupIndex = 0;
    return groups[currentGroupIndex];
  }

  function renderHeader() {
    const yearSelect = document.getElementById("yearSelect");
    yearSelect.innerHTML = Object.keys(state.years).map(y =>
      `<option value="${y}" ${y === state.activeYear ? "selected" : ""}>${y}</option>`
    ).join("");

    const groups = getGroups();
    const container = document.getElementById("groupsContainer");
    if (!groups.length) {
      container.innerHTML = `<span style="font-size:13px; color:var(--hint);">Нет групп — создайте во вкладке «Управление»</span>`;
      return;
    }

    container.innerHTML = groups.map((g, idx) => `
      <div class="group-chip ${idx === currentGroupIndex ? "active" : ""}" onclick="selectGroup(${idx})">
        ${g.name} <span class="group-badge">${g.scheduleText.split(" ")[0]} тр.</span>
      </div>
    `).join("");
  }

  function changeYear(year) {
    state.activeYear = year;
    currentGroupIndex = 0;
    const g = getCurrentGroup();
    currentSessionIndex = g ? Math.max(0, g.sessions.length - 1) : 0;
    saveState();
    renderAll();
  }

  function selectGroup(idx) {
    currentGroupIndex = idx;
    const g = getCurrentGroup();
    currentSessionIndex = g ? Math.max(0, g.sessions.length - 1) : 0;
    renderAll();
  }

  function renderJournal() {
    const group = getCurrentGroup();
    const listEl = document.getElementById("studentList");

    if (!group) {
      document.getElementById("sessionDateTitle").innerText = "Нет групп";
      document.getElementById("sessionTypeLabel").innerText = "Создайте группу в настройках";
      listEl.innerHTML = `<div class="empty-state">Перейдите в «Управление» и создайте первую группу</div>`;
      return;
    }

    const session = group.sessions[currentSessionIndex];
    document.getElementById("sessionDateTitle").innerText = session.date;
    document.getElementById("sessionTypeLabel").innerText = `${session.type} • ${group.scheduleText}`;

    if (!group.students.length) {
      document.getElementById("statsCounter").innerText = "В группе пока нет участников";
      listEl.innerHTML = `<div class="empty-state">Добавьте спортсменов во вкладке «Управление»</div>`;
      return;
    }

    let presentCount = 0;
    listEl.innerHTML = group.students.map(st => {
      const status = session.marks[st.id] || "none";
      if (status === "present") presentCount++;

      const cfg = {
        none: { label: "Не отмечен", icon: "⬜", cls: "status-none" },
        present: { label: "Был", icon: "✅", cls: "status-present" },
        absent: { label: "Не был", icon: "❌", cls: "status-absent" },
        sick: { label: "Болеет", icon: "🤒", cls: "status-sick" }
      }[status];

      return `
        <div class="student-row" onclick="toggleStatus('${st.id}')">
          <div class="student-info">
            <span class="student-name">${st.name}</span>
            <span class="student-meta">${st.birth} г.р.</span>
          </div>
          <div class="status-box ${cfg.cls}">
            <span>${cfg.icon}</span>
            <span>${cfg.label}</span>
          </div>
        </div>
      `;
    }).join("");

    document.getElementById("statsCounter").innerText = `На тренировке: ${presentCount} из ${group.students.length}`;
  }

  function toggleStatus(studentId) {
    const group = getCurrentGroup();
    const session = group.sessions[currentSessionIndex];
    const order = ["none", "present", "absent", "sick"];
    const current = session.marks[studentId] || "none";
    session.marks[studentId] = order[(order.indexOf(current) + 1) % order.length];

    if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    saveState();
    renderJournal();
  }

  function markAllPresent() {
    const group = getCurrentGroup();
    if (!group || !group.students.length) return;
    const session = group.sessions[currentSessionIndex];
    group.students.forEach(st => session.marks[st.id] = "present");
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    saveState();
    renderJournal();
  }

  function shiftSession(dir) {
    const group = getCurrentGroup();
    if (!group) return;
    const nextIdx = currentSessionIndex + dir;
    if (nextIdx >= 0 && nextIdx < group.sessions.length) {
      currentSessionIndex = nextIdx;
      renderJournal();
    }
  }

  function addExtraSession() {
    const group = getCurrentGroup();
    if (!group) return alert("Сначала создайте группу");
    const dateStr = prompt("Дата тренировки (напр. 26 ноя (Чт)):", "26 ноя (Чт)");
    if (!dateStr) return;
    const typeStr = prompt("Место / вид (Вода, Зал, Бассейн):", "Вода • 10 км") || "Тренировка";

    group.sessions.push({
      id: "ses_" + Date.now(),
      date: dateStr,
      type: typeStr,
      marks: {}
    });
    currentSessionIndex = group.sessions.length - 1;
    saveState();
    renderJournal();
  }

  function renderReport() {
    const group = getCurrentGroup();
    if (!group) return;
    document.getElementById("reportGroupTitle").innerText = `Табель: ${group.name} (${state.activeYear})`;

    let thead = `<tr><th>Спортсмен</th>` +
      group.sessions.map(s => `<th>${s.date.split(" ")[0]}<br><small>${s.date.split(" ")[1] || ""}</small></th>`).join("") +
      `<th>%</th></tr>`;

    let tbody = group.students.map(st => {
      let attended = 0;
      const cells = group.sessions.map(s => {
        const m = s.marks[st.id];
        if (m === "present") { attended++; return "<td>✅</td>"; }
        if (m === "absent") return "<td>❌</td>";
        if (m === "sick") return "<td>🤒</td>";
        return "<td>·</td>";
      }).join("");
      const pct = group.sessions.length ? Math.round((attended / group.sessions.length) * 100) : 0;
      return `<tr><td>${st.name}</td>${cells}<td><strong>${pct}%</strong></td></tr>`;
    }).join("");

    document.getElementById("reportTable").innerHTML = thead + tbody;
  }

  function exportCSV() {
    const group = getCurrentGroup();
    if (!group) return;
    let csv = "\uFEFFСпортсмен;" + group.sessions.map(s => s.date).join(";") + "\n";
    group.students.forEach(st => {
      const row = group.sessions.map(s => {
        const m = s.marks[st.id];
        return m === "present" ? "Был" : m === "absent" ? "Н" : m === "sick" ? "Б" : "";
      });
      csv += `${st.name};${row.join(";")}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Табель_${group.name}_${state.activeYear}.csv`;
    link.click();
  }

  function renderSettings() {
    document.getElementById("manageYearLabel").innerText = state.activeYear;
    const group = getCurrentGroup();

    const stContainer = document.getElementById("manageStudentsList");
    if (group) {
      document.getElementById("manageStudentsTitle").innerText = `Спортсмены группы ${group.name}`;
      stContainer.innerHTML = group.students.length
        ? group.students.map(st => `
            <div class="manage-item">
              <span>${st.name} <small style="color:var(--hint)">(${st.birth} г.р.)</small></span>
              <button class="del-btn" onclick="deleteStudent('${st.id}')">Удалить</button>
            </div>
          `).join("")
        : `<div style="font-size:13px; color:var(--hint);">Список пуст</div>`;
    } else {
      document.getElementById("manageStudentsTitle").innerText = "Спортсмены (сначала создайте группу)";
      stContainer.innerHTML = "";
    }

    const groups = getGroups();
    document.getElementById("manageGroupsList").innerHTML = groups.map((g, idx) => `
      <div class="manage-item">
        <div>
          <strong>${g.name}</strong>
          <div style="font-size:12px; color:var(--hint)">${g.scheduleText} • ${g.students.length} чел.</div>
        </div>
        <button class="del-btn" onclick="deleteGroup(${idx})">Удалить</button>
      </div>
    `).join("");
  }

  function addStudent() {
    const group = getCurrentGroup();
    if (!group) return alert("Сначала создайте группу");
    const name = document.getElementById("newStudentName").value.trim();
    const birth = document.getElementById("newStudentYear").value.trim() || "2014";
    if (!name) return alert("Введите ФИО спортсмена");

    group.students.push({ id: "st_" + Date.now(), name, birth });
    group.students.sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById("newStudentName").value = "";
    saveState();
    renderSettings();
    renderJournal();
  }

  function deleteStudent(studentId) {
    const group = getCurrentGroup();
    if (!confirm("Удалить спортсмена из группы?")) return;
    group.students = group.students.filter(s => s.id !== studentId);
    saveState();
    renderSettings();
    renderJournal();
  }

  function addGroup() {
    const name = document.getElementById("newGroupName").value.trim();
    const freq = document.getElementById("newGroupFreq").value;
    const days = document.getElementById("newGroupDays").value.trim();
    if (!name) return alert("Введите название группы (например, НП-2)");

    const scheduleText = days ? `${freq} (${days})` : freq;
    const groups = getGroups();
    groups.push({
      id: "grp_" + Date.now(),
      name,
      scheduleText,
      students: [],
      sessions: [
        { id: "ses_" + Date.now(), date: "Сегодня", type: "Плановая тренировка", marks: {} }
      ]
    });

    document.getElementById("newGroupName").value = "";
    document.getElementById("newGroupDays").value = "";
    currentGroupIndex = groups.length - 1;
    currentSessionIndex = 0;
    saveState();
    renderHeader();
    renderSettings();
  }

  function deleteGroup(idx) {
    const groups = getGroups();
    if (!confirm(`Удалить группу ${groups[idx].name} и весь её журнал?`)) return;
    groups.splice(idx, 1);
    currentGroupIndex = 0;
    currentSessionIndex = 0;
    saveState();
    renderHeader();
    renderSettings();
  }

  function createNextAcademicYear() {
    const startYear = parseInt(state.activeYear.split("–")[0]);
    const nextYearName = `${startYear + 1}–${startYear + 2}`;

    if (state.years[nextYearName]) {
      return alert(`Учебный год ${nextYearName} уже существует!`);
    }

    const oldGroups = getGroups();
    const newGroups = oldGroups.map(g => {
      const upgradedName = g.name.replace(/(\d+)/, n => parseInt(n) + 1);
      return {
        id: g.id + "_" + (startYear + 1),
        name: upgradedName,
        scheduleText: g.scheduleText,
        students: JSON.parse(JSON.stringify(g.students)),
        sessions: [
          { id: "init_" + Date.now(), date: "01 сен (Вт)", type: "Организационная", marks: {} }
        ]
      };
    });

    state.years[nextYearName] = { groups: newGroups };
    state.activeYear = nextYearName;
    currentGroupIndex = 0;
    currentSessionIndex = 0;
    saveState();
    renderAll();
    renderSettings();
    alert(`Создан учебный год ${nextYearName}! Группы переведены на ступень выше.`);
  }

  function switchTab(tabName, btnEl) {
    ["journal", "report", "settings"].forEach(t => {
      document.getElementById("tab-" + t).classList.add("hidden");
    });
    document.getElementById("tab-" + tabName).classList.remove("hidden");

    document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");

    if (tabName === "journal") renderJournal();
    if (tabName === "report") renderReport();
    if (tabName === "settings") renderSettings();
  }

  function renderAll() {
    renderHeader();
    renderJournal();
  }

  const initGroup = getCurrentGroup();
  currentSessionIndex = initGroup ? Math.max(0, initGroup.sessions.length - 1) : 0;
  renderAll();
  loadFromCloud();
  // Автоматически подтягивать свежие данные при возврате в Telegram
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      loadFromCloud();
    }
  });

  // Мгновенная синхронизация в реальном времени между телефоном и ПК
  db.channel("canoe-sync")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "app_state", filter: `id=eq.${RECORD_ID}` }, payload => {
      if (payload.new && payload.new.data) {
        state = payload.new.data;
        localStorage.setItem("canoe_app_cache", JSON.stringify(state));
        renderAll();
        if (!document.getElementById("tab-settings").classList.contains("hidden")) renderSettings();
        if (!document.getElementById("tab-report").classList.contains("hidden")) renderReport();
        setSyncStatus("☁️ Обновлено", "var(--green)");
      }
    })
    .subscribe();
</script>
</body>
</html>
